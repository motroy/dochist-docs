# Splits README.md into mdBook chapters and deploys the built book to
# GitHub Pages whenever docs content on `main` changes (synced here by
# the dochist repo's release workflow), or on manual dispatch.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "LICENSE"
      - "demo/**"
      - "book.toml"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split README into mdBook chapters
        run: python3 scripts/split-readme.py

      - name: Copy assets into book source
        run: |
          cp LICENSE src/LICENSE
          if [ -d demo ]; then cp -r demo src/demo; fi

      - name: Install mdBook
        run: |
          set -euo pipefail
          version=$(curl -sSL https://api.github.com/repos/rust-lang/mdBook/releases/latest | jq -r .tag_name)
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${version}/mdbook-${version}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Build book
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
