# Builds the Elm docs app and deploys it to GitHub Pages whenever docs
# content on `main` changes (synced here by the dochist repo's release
# workflow), or on manual dispatch. The Elm app fetches README.md at
# runtime and renders it as HTML, so no server-side markdown build step
# is needed beyond compiling the app itself.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "demo/**"
      - "src/**"
      - "elm.json"
      - "index.html"
      - "style.css"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json') }}

      - name: Install Elm
        run: npm install -g elm@0.19.1-6

      - name: Build Elm app
        run: elm make src/Main.elm --optimize --output=main.js

      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp style.css site/style.css
          cp main.js site/main.js
          cp README.md site/README.md
          if [ -f LICENSE ]; then cp LICENSE site/LICENSE; fi
          if [ -d demo ]; then cp -r demo site/demo; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
