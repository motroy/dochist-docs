# Renders README.md into a static site and deploys it to GitHub Pages
# whenever docs content on `main` changes (synced here by the dochist
# repo's release workflow), or on manual dispatch.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p site
          cat > site/style.css <<'CSS'
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1.5rem; line-height: 1.6; color: #1f2328; }
          pre { background: #f6f8fa; padding: 1rem; overflow-x: auto; border-radius: 6px; }
          code { background: #f6f8fa; padding: 0.15em 0.35em; border-radius: 4px; }
          pre code { background: none; padding: 0; }
          a { color: #0969da; }
          img { max-width: 100%; }
          h1, h2, h3 { border-bottom: 1px solid #d0d7de; padding-bottom: 0.3em; }
          CSS
          if [ -d demo ]; then cp -r demo site/demo; fi
          if [ -f LICENSE ]; then cp LICENSE site/LICENSE; fi

      - name: Render README to HTML
        uses: docker://pandoc/core:3.1
        with:
          args: >-
            --standalone
            --metadata title="dochist docs"
            --css=style.css
            -o site/index.html
            README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
